# Render blueprint for the Nuru Wellness demonstration deployment.
# Replace ROOT_DOMAIN and NEXT_PUBLIC_APP_URL with the hostnames Render gives
# you (or your verified custom domain) before applying the blueprint.
#
# Free workspaces allow one active free Postgres database. If one already
# exists, Render rejects the database block below: create a `nuru` database
# inside the existing instance and set DATABASE_URL on the web service
# instead, then remove the `databases` block.
services:
  - type: web
    name: nuru-wellness
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nuru-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_AUTO_LOGIN
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://nuru-wellness.onrender.com
      - key: ROOT_DOMAIN
        value: nuru-wellness.onrender.com
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local

databases:
  - name: nuru-db
    databaseName: nuru
    user: nuru
    plan: free
